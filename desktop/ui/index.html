<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TouDi · 投递中控台</title><style>
:root{color-scheme:light dark;--bg:#f4f6f7;--text:#243338;--muted:#62767c;--line:#d5dfe2;--panel:#fff;--accent:#386a70}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;display:grid;place-items:center}.boot{width:min(480px,90vw);padding:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px}h1{font-size:24px;margin:0 0 14px}p{color:var(--muted)}button{font:inherit;padding:8px 16px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--text);cursor:pointer}.error{white-space:pre-wrap;color:#a45750}@media(prefers-color-scheme:dark){:root{--bg:#172023;--text:#e7eded;--muted:#a2b4b9;--line:#35454b;--panel:#212d31;--accent:#80afb5}}
</style></head><body><main class="boot"><h1>TouDi / 投递中控台</h1><p id="bootStatus" role="status">正在打开你的工作台…</p><p id="bootError" class="error"></p><button id="retry" hidden onclick="loadWorkbench(true)">重新打开</button></main><script>
async function loadWorkbench(retry=false){
 const status=document.getElementById('bootStatus'),error=document.getElementById('bootError');
 status.textContent='正在打开你的工作台…';error.textContent='';document.getElementById('retry').hidden=true;
 try{
  if(retry)await window.__TAURI__.core.invoke('restart_runtime');
  const context=await window.__TAURI__.core.invoke('desktop_context');
  if(context.error)throw Error(context.error);
  // Navigate to a bundled document so Tauri applies its script hashes and style nonces.
  location.replace('/workbench.html');
 }catch(e){status.textContent='工作台未能打开，已保存的资料仍保留。';error.textContent=String(e);document.getElementById('retry').hidden=false;}
}
loadWorkbench();
</script></body></html>
