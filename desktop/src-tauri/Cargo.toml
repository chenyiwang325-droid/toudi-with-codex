[package]
name = "toudi"
version = "0.2.0"
description = "TouDi personal application workbench"
authors = ["TouDi contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
