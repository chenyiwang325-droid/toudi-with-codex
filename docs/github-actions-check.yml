name: Source and isolated runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python tests/check_source.py
      - run: python -m unittest discover -s tests -v
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/toudi-tests" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/toudi-tests/node_modules/.bin/playwright" install --with-deps chromium
          echo "TOUDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/toudi-tests/node_modules/playwright" >> "$GITHUB_ENV"
          node -e 'console.log("CHROME_PATH="+require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/toudi-tests/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Check forms, shared profiles, rendering and privacy
        run: |
          for test in tests/*.cjs; do node "$test"; done
