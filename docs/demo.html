<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TouDi 操作演示</title><link rel="icon" href="assets/favicon.svg"><style>body{margin:0;background:#f5f7f7;color:#26383d;font:16px/1.6 system-ui,sans-serif}main{max-width:1180px;margin:32px auto;padding:0 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:26px;margin:0}p{color:#607277}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;padding:7px 16px;background:white;border:1px solid #d8e1e2;border-radius:5px;color:#26383d;cursor:pointer}button[aria-pressed=true]{border-color:#426a70;color:#426a70;box-shadow:inset 0 -2px #426a70}button:focus-visible{outline:2px solid #426a70;outline-offset:3px}img{max-width:100%;height:auto;display:block;border:1px solid #d8e1e2}a{color:#426a70;text-decoration:underline}@media(max-width:600px){header{display:block}main{margin:20px auto}}</style><main><header><h1>TouDi / 操作演示</h1><a href="../README.md">仓库说明</a></header><p>演示采用匿名替代内容，不含真实个人资料。</p><nav aria-label="演示步骤"></nav><img id="frame" alt="说明性操作步骤"><p id="caption" aria-live="polite"></p></main><script>const steps=[['投递','delivery-frame.png','搜索筛选与标记在记录附近完成。'],['准备','preparation-frame.png','模式内全资料搜索，按独立题目阅读主答和备答。'],['探查','prospect-frame.png','结论与证据分层，目录可收起释放正文。'],['复盘','review-frame.png','全场要点前置，保留原答与必要改写。'],['Agent协作','agent-frame.png','用户提供信源，自己的Agent按仓库契约执行。']];const nav=document.querySelector('nav');steps.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>show(i);nav.append(b)});function show(i){document.getElementById('frame').src='assets/'+steps[i][1];document.getElementById('caption').textContent=steps[i][2];[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)))}show(0)</script></html>
