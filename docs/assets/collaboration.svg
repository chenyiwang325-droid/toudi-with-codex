<svg xmlns="http://www.w3.org/2000/svg" width="830" height="222" viewBox="0 0 830 222" role="img" aria-label="用户确定任务，自己的Agent核对整理，工作台保存阅读与复用"><rect width="830" height="222" rx="8" fill="#f4f7f7"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#24383c"><text x="26" y="34" font-size="16" font-weight="600">每次明确一个任务，让资料变成可继续使用的结果</text><path d="M274 112h24m-7-5 7 5-7 5M544 112h24m-7-5 7 5-7 5" fill="none" stroke="#416a70" stroke-width="2"/><g font-size="20" font-weight="600"><text x="26" y="86">你</text><text x="306" y="86">自己的 Agent</text><text x="574" y="86">TouDi 工作台</text></g><g font-size="16"><text x="26" y="119">信源 · 真实资料 · 本次范围</text><text x="306" y="119">核对 · 整理 · 验证</text><text x="574" y="119">保存 · 阅读 · 标记 · 复用</text></g><g fill="#5e7276" font-size="14"><text x="26" y="149">确定目标，保留判断</text><text x="306" y="149">在你的外部工具中执行</text><text x="574" y="149">记录、准备、探查与复盘</text></g><path d="M26 171h778" stroke="#d6e1e3"/><text x="26" y="199" font-size="14" fill="#5e7276">下一次任务从已有记录与资料继续；内化、网申和公开发布需要明确请求。</text></g></svg>