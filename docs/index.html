<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TouDi · 协作演示</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="demo.css"></head>
<body><main><header class="page-header"><div><img src="assets/logo.svg" width="138" height="48" alt="TouDi"><h1>与自己的 Agent 协作的求职工作台</h1></div><a href="https://github.com/chenyiwang325-droid/toudi-workbench">查看仓库</a></header><p class="boundary">协作流程示意，Agent 在你自己的工具中执行。以下内容为匿名替代，不是实际招聘信息或个人资料。</p><nav id="tasks" aria-label="选择任务"></nav><section class="story-heading"><div><h2 id="taskTitle"></h2><p id="taskPurpose"></p></div><p class="outcome" id="taskOutcome"></p></section><ol id="timeline" aria-label="协作阶段"></ol><footer class="controls"><div><button id="prev">上一阶段</button><button id="next" class="primary">演示下一阶段</button><button id="play">播放过程</button><button id="restart">重播</button><label class="speed-label">每阶段<select id="speed"><option value="6000">6 秒</option><option value="10000" selected>10 秒</option><option value="15000">15 秒</option></select></label></div><p id="status" aria-live="polite"></p><small id="motionNote"></small></footer><div class="canvas"><section class="actor user"><header><span>用户</span><h3>确定任务与资料</h3></header><div id="userContent"></div></section><section class="actor agent"><header><span>自己的 Agent</span><h3 id="agentTitle">核对、整理、验证</h3></header><div class="transfer" aria-hidden="true"><span class="material">资料</span><span class="transfer-path"></span><span class="result-token">产物</span></div><div id="agentContent"></div></section><section class="actor result"><header><span>TouDi 工作台</span><h3 id="resultTitle">保存、阅读与复用</h3></header><div id="resultContent"></div></section></div><section class="handoff"><div><h2>把真实任务交给自己的 Agent</h2><p>下载工作台，提供信源、资料与明确范围。仓库契约告诉 Agent 如何生成、核对和更新产物。</p></div><div><button id="copy">复制接入话术</button><a href="https://github.com/chenyiwang325-droid/toudi-workbench/blob/main/docs/首次使用与部署.md">开始使用</a><a href="https://github.com/chenyiwang325-droid/toudi-workbench/blob/main/docs/内容与渲染契约.md">内容协议</a></div></section><p class="copy-result" id="copyResult" role="status"></p></main><script src="demo.js"></script></body></html>
