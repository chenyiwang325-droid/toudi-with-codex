<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TouDi · 辅助填报</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="logo.svg" width="26" height="26" alt=""><div><strong>TouDi · 辅助填报</strong><small>本地资料 · 当前网页</small></div><button id="settings" class="quiet">资料与设置</button></header>
<main>
  <section id="empty"><h1>先导入自己的资料</h1><p>保存一次个人、教育和经历资料，以后在网申页面直接识别与填写。</p><button id="importStart" class="primary">打开资料库</button><p class="caption">基本填写可独立使用。Luna 核对需要首次安装本机连接工具。</p></section>
  <section id="controls" hidden><div class="profile"><label for="profile">本次简历口径</label><select id="profile"><option value="general">个人与教育通用</option><option value="state">央国企／专业口径</option><option value="ai-product">AI 产品口径</option></select></div><p id="sourceStatus" class="caption"></p><button id="scan" class="primary">识别当前页面</button><p class="caption">默认保留已有内容；填写后逐项读回核验。</p><label class="check"><input id="autoLuna" type="checkbox">识别后自动用 Luna 核对歧义</label></section>
  <p id="notice" role="status" hidden></p>
  <section id="review" hidden></section>
  <section id="agent" hidden><h2>核对歧义字段</h2><p>先快速匹配明确字段；不确定的名称由 Luna 匹配到已有资料，具体填写值留在本机。</p><button id="agentCli">用 Luna 核对歧义</button><p id="agentConnectionStatus" class="caption">GPT-6 Luna · 现有 Codex 额度。只有点击核对才调用模型，不自动换用其他模型。</p><details><summary>连接检查与其他 Agent</summary><button id="agentCheck">检查 Codex 连接</button><p>也可把字段结构交给已有的 Agent，再导入返回的匹配。</p><div class="buttons"><button id="agentCopy">复制匹配任务</button></div><label for="agentResult">Agent 返回的 JSON 匹配</label><textarea id="agentResult" rows="3" placeholder='{"字段id":"资料键"}' spellcheck="false"></textarea><label class="check"><input id="remember" type="checkbox">记住本页匹配（页面结构变化后失效）</label><button id="agentImport">导入并重新核对</button></details></section>
  <section id="result" hidden></section>
</main><footer id="actions" hidden><span id="selectionCount"></span><button id="fill" class="primary">填写所选字段</button></footer><script src="popup.js"></script></body></html>
