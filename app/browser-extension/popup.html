<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TouDi · 辅助填报</title><link rel="stylesheet" href="interface.css"><link rel="stylesheet" href="popup.css"><script src="interface-motion.js" defer></script></head>
<body>
<header><img src="logo.svg" width="25" height="25" alt=""><strong>TouDi · 辅助填报</strong><small id="runtimeVersion" class="sr-only"></small><button id="settings" class="quiet">资料与设置</button></header>
<nav class="panel-tabs" role="tablist" aria-label="填报工具"><button id="tabFill" role="tab" aria-selected="true" aria-controls="fillPane">自动填写</button><button id="tabLibrary" role="tab" aria-selected="false" aria-controls="copyLibrary" tabindex="-1">我的资料</button></nav>
<main>
<p id="workspaceSync" class="caption" role="status" hidden></p>
<section id="empty"><h1>先添加自己的资料</h1><p>保存个人信息和经历，再回到招聘网页填写。</p><button id="importStart" class="primary">打开资料库</button></section>
<section id="controls" hidden><div class="profile"><label for="profile">资料版本</label><select id="profile"><option value="general">默认资料</option></select></div></section>
<p id="notice" role="status" hidden></p>
<section id="fillPane" role="tabpanel" aria-labelledby="tabFill">
  <div class="fill-intro"><h1>填写当前网页</h1><button id="scan" class="quiet">重新识别</button></div>
  <section id="scanSummary" aria-live="polite"><p>正在识别网页中的填写内容…</p></section>
  <div class="fill-actions"><label class="sr-only" for="fillMode">填写范围</label><select id="fillMode"><option value="all">填写全部内容</option><option value="empty">仅填空白</option></select><button id="reviewAgent" disabled>Agent 核对</button><button id="fill" class="primary" disabled>自动填写</button></div>
  <p id="progress" role="status" hidden></p>
  <p id="reviewResult" class="caption" role="status" hidden></p>
  <details id="reviewDetails" class="review-details" hidden><summary id="reviewDetailsSummary">查看核对结果</summary><div id="reviewItems"></div></details>
  <section id="result" aria-live="polite" hidden></section>
  <section id="scanGroups" aria-label="已识别的填写内容"></section>
  <button id="browseFallback" class="text-button">查找资料并复制填写</button>
</section>
<section id="copyLibrary" role="tabpanel" aria-labelledby="tabLibrary" hidden><div class="library-search"><label class="sr-only" for="copySearch">搜索资料</label><input id="copySearch" type="search" placeholder="搜索字段、经历或内容"><span id="copyCount" class="caption" role="status"></span></div><div class="library-layout"><nav id="copyDirectory" aria-label="资料分类目录"></nav><div class="library-content"><div id="copyRecords" tabindex="0" aria-label="资料内容"></div></div></div></section>
</main>
<footer><button id="openWorkbench" class="text-button">打开投递中控台</button></footer>
<script src="profile-view.js"></script><script src="agent-config.js"></script><script src="filling-workflow.js"></script><script src="popup.js"></script>
</body></html>
