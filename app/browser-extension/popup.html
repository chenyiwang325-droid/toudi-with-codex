<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TouDi · 辅助填报</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="logo.svg" width="26" height="26" alt=""><div><strong>TouDi · 辅助填报</strong><small id="runtimeVersion">本地资料 · 当前网页</small></div><button id="settings" class="quiet">资料与设置</button></header>
<main><p id="workspaceSync" class="caption" role="status" hidden></p>
  <section id="empty"><h1>先填写自己的资料</h1><p>保存一次个人、教育和经历资料，以后在网申页面直接识别与填写。</p><button id="importStart" class="primary">打开资料库</button><p class="caption">基本填写可独立使用。Agent 协作可在设置中自行选择。</p></section>
  <section id="controls" hidden><div class="profile"><label for="profile">本次资料版本</label><select id="profile"><option value="general">默认资料</option></select></div><p id="sourceStatus" class="caption"></p><button id="scan" class="primary">识别当前页面</button><p class="caption">默认保留已有内容；填写后逐项读回核验。</p><label id="autoAgentRow" class="check"><input id="autoAgent" type="checkbox">识别后自动用所选模型核对歧义</label></section>
  <p id="notice" role="status" hidden></p>
  <section id="structureFeedback" aria-live="polite" hidden></section>
  <section id="agentFeedback" aria-live="polite" hidden></section>
  <section id="review" hidden></section>
  <section id="agent" hidden><h2>核对歧义字段</h2><p>不确定的字段由你选择的 Agent 匹配到已有资料；具体填写值留在本地。</p><div class="buttons"><button id="structureCli">补充页面结构</button><button id="agentCli">配置 Agent 协作</button><button id="agentSettings" class="quiet">协作设置</button></div><p id="agentConnectionStatus" class="caption"></p><details id="agentTransfer"><summary>复制任务与导入结果</summary><p>把字段结构交给自己正在使用的 Agent，再导入返回的匹配。</p><button id="structureCopy">复制结构适配任务</button><button id="agentCopy">复制匹配任务</button><label for="agentResult">Agent 返回的 JSON 匹配</label><textarea id="agentResult" rows="3" placeholder='{"字段id":"资料键"}' spellcheck="false"></textarea><label class="check"><input id="remember" type="checkbox">记住本页匹配（页面结构变化后失效）</label><button id="structureImport">导入结构适配 JSON</button><button id="agentImport">导入并重新核对</button></details><button id="agentCheck" class="quiet">检查 Codex 连接</button></section>
  <section id="result" hidden></section>
<nav class="extension-links" aria-label="关联工作台"><button id="openWorkbench" class="quiet">打开投递中控台</button><a href="https://github.com/chenyiwang325-droid/toudi-workbench/blob/main/docs/辅助填报.md" target="_blank" rel="noreferrer">安装与使用</a></nav></main><footer id="actions" hidden><span id="selectionCount"></span><button id="fill" class="primary">填写所选字段</button></footer><script src="agent-config.js"></script><script src="popup.js"></script></body></html>
