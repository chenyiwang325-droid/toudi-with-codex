<script>
// ============== DATA ==============
const RAW_DATA = [];

// SVG Icons (Lucide style)
const ICONS = {

  starOutline: '<svg viewBox="0 0 24 24" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  note: '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  excluded: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>',
};
function svgIcon(name, cls) { return '<span class="icon ' + (cls||'') + '">' + (ICONS[name]||'') + '</span>'; }


// ============== JS LOGIC ==============
// ============== CONSTANTS ==============
const STATUSES = ['未投递','已投递','笔试','面试','已通过','已拒绝','已截止'];
const STATUS_COLORS = Object.fromEntries(STATUSES.map(status=>[status,'var(--primary)']));
const UNKNOWN_STATUS = '其他标记/待核实';
const UNKNOWN_STATUS_COLOR = '#64748b';
const CHART_COLORS = ['var(--primary)'];
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

const QUICK_VIEWS = [
  { id:'all', label:'全部', icon:'all' },
  { id:'urgent', label:'即将截止', icon:'urgent' },
  { id:'expired', label:'已过期', icon:'expired' },
  { id:'recent', label:'最近新增', icon:'recent' },
  { id:'starred', label:'我的收藏', icon:'starred' },
  { id:'research', label:'待探查', icon:'recent' },
  { id:'recommended', label:'适合我', icon:'recommended' },
  { id:'inProgress', label:'进行中', icon:'inProgress' },
  { id:'excluded', label:'不适合', icon:'excluded' },
];

// Preference defaults
const DEFAULT_PREF = {
  natures: [],
  industries: [],
  education: [],
  rvSideCollapsed: false
};

// ============== STATE ==============
let data = [], userEdits = {}, filters = {}, preferences = {...DEFAULT_PREF};
let searchQuery = '', sortField = '', sortAsc = true, currentPage = 1, pageSize = 50;
let currentNoteIdx = -1, view = 'table', currentQV = 'all';
let selected = new Set();

// ============== STORAGE ==============
let serverMode = false, saveTimer = null, editsVersion = '0', editsDraftBase = null, personalReady = false;
// 编辑记录以【公司】为键（唯一名=名称，重名=名称｜公告链接），行号变化不再影响标记归属（2026-08-10 索引漂移事故后改造）
function recomputeKeys(){
  const counts={}; data.forEach(it=>{counts[it['名称']]=(counts[it['名称']]||0)+1;});
  data.forEach((it,i)=>{
    let k=it['名称'];
    if(counts[k]>1) k=k+'｜'+(it['公告链接']||('#'+(i+1)));
    if(it._key && it._key!==k && userEdits[it._key]!==undefined){
      if(userEdits[k]===undefined) userEdits[k]=userEdits[it._key];
      else { const a=userEdits[k],b=userEdits[it._key]; a.excluded=!!a.excluded||!!b.excluded; a.starred=!!a.starred||!!b.starred; a.research=!!a.research||!!b.research; if(b.researchNote&&a.researchNote!==b.researchNote)a.researchNote=[a.researchNote,b.researchNote].filter(Boolean).join('\n\n'); if(!a.status&&b.status)a.status=b.status; if(!a.note&&b.note)a.note=b.note; a.fields=Object.assign({},b.fields||{},a.fields||{}); if(!Object.keys(a.fields).length)delete a.fields; }
      delete userEdits[it._key];
    }
    it._key=k;
  });
}
function editFor(idx){ const it=byId(idx); if(!it)return {}; return editForItem(it); }
function editForItem(it){ const k=it._key; if(!userEdits[k])userEdits[k]={}; return userEdits[k]; }
function byId(idx){ return data.find(d=>d._idx===idx); }

function cachedData(key){if(window.__SNAPSHOT_SEED__)return window.__SNAPSHOT_SEED__[key]||null;try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}}
function loadEdits(){const d=cachedData('toudiEdits');if(d)userEdits=d;}
function saveEdits() { savePersonalDraft(); }
function loadPref(){const d=cachedData('toudiPref');if(d)preferences={...DEFAULT_PREF,...d};}
function savePrefStorage() { savePersonalDraft(); }

// 本地文件存储：通过「启动中控台.command」启动本地服务后启用，数据落盘到 用户编辑数据.json
// 支持跨源：即使是从 file:// 直接打开的旧页面，也能连上本地服务并自动把浏览器缓存迁移落盘
let apiBase = null;
const SAVE_DOMAINS={
  edits:{label:'个人数据',state:'idle',message:''},
  reviews:{label:'复盘',state:'idle',message:''},
  qbank:{label:'问答库',state:'idle',message:''}
};
let editsSaveGeneration=0, editsSaveInFlight=false, editsDirty=false, editsConflict=false;
function isPlainObject(v){return !!v&&typeof v==='object'&&!Array.isArray(v);}
function setSaveState(domain,state,message=''){const d=SAVE_DOMAINS[domain];if(!d)return;d.state=state;d.message=message;d.readFailed=false;updateStorageBadge();}
function setReadError(domain,message){const d=SAVE_DOMAINS[domain];if(!d)return;d.state='error';d.message=message;d.readFailed=true;updateStorageBadge();}
const DRAFT_PREFIX={edits:'jobEditsDraft:',reviews:'jobReviewsDraft:',qbank:'jobQbankDraft:'};
const LEGACY_DRAFT_KEY={edits:'jobEditsDraft',reviews:'jobReviewsDraft',qbank:'jobQbankDraft'};
let draftSessionId='';
try{draftSessionId=sessionStorage.getItem('toudiDraftSession_27')||'';if(!draftSessionId){draftSessionId=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));sessionStorage.setItem('toudiDraftSession_27',draftSessionId);}}catch(e){draftSessionId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
function ownDraftKey(domain){return DRAFT_PREFIX[domain]+draftSessionId;}
function parseDraft(raw){try{const d=JSON.parse(raw||'null');return d&&d.format==='toudi-unsaved-draft'&&d.version===2&&isPlainObject(d.data)&&typeof d.base==='string'&&typeof d.revision==='number'?d:null;}catch(e){return null;}}
function readOwnDraft(domain){return parseDraft(localStorage.getItem(ownDraftKey(domain)));}
function readLegacyDraft(domain){try{const d=JSON.parse(localStorage.getItem(LEGACY_DRAFT_KEY[domain])||'null');return d&&d.format==='toudi-unsaved-draft'&&isPlainObject(d.data)?{...d,version:2,base:String(d.base),revision:Number(d.revision)||1,sessionId:'legacy'}:null;}catch(e){return null;}}
function writeDraft(domain,base,data){const old=readOwnDraft(domain),revision=(old?.revision||0)+1;const draft={format:'toudi-unsaved-draft',version:2,domain,sessionId:draftSessionId,revision,base:String(base),savedAt:new Date().toISOString(),data,...(old?.legacySource?{legacySource:old.legacySource}:{})};localStorage.setItem(ownDraftKey(domain),JSON.stringify(draft));return draft;}
function migrateLegacyDraft(domain,draft,raw){const migrated={format:'toudi-unsaved-draft',version:2,domain,sessionId:draftSessionId,revision:1,base:String(draft.base),savedAt:new Date().toISOString(),data:draft.data,legacySource:{key:LEGACY_DRAFT_KEY[domain],raw}};localStorage.setItem(ownDraftKey(domain),JSON.stringify(migrated));return migrated;}
function clearOwnDraft(domain,revision){const current=readOwnDraft(domain);if(current&&current.sessionId===draftSessionId&&current.revision===revision)localStorage.removeItem(ownDraftKey(domain));}
function clearLegacySourceAfterSave(draft){const source=draft?.legacySource;if(source&&typeof source.key==='string'&&typeof source.raw==='string'&&localStorage.getItem(source.key)===source.raw)localStorage.removeItem(source.key);}
function advanceOwnDraftBase(domain,revision,newBase){const current=readOwnDraft(domain);if(current&&current.sessionId===draftSessionId&&current.revision>revision){current.base=String(newBase);localStorage.setItem(ownDraftKey(domain),JSON.stringify(current));return true;}return false;}
function listUnsavedDrafts(){const found=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);for(const [domain,prefix] of Object.entries(DRAFT_PREFIX)){if(key&&key.startsWith(prefix)){const draft=parseDraft(localStorage.getItem(key));if(draft)found.push({domain,key,draft});}}}for(const domain of Object.keys(LEGACY_DRAFT_KEY)){const draft=readLegacyDraft(domain);if(draft)found.push({domain,key:LEGACY_DRAFT_KEY[domain],draft});}return found;}
function personalMutationAllowed(){if(window.__SNAPSHOT__){showToast('此快照仅供阅读，请在电脑端修改');return false;}if(personalReady)return true;showToast('正在确认本地数据版本，暂不能修改');return false;}
function savePersonalDraft(){
  if(!personalMutationAllowed())return;
  if(!serverMode||apiBase===null)return;
  if(editsDraftBase===null)editsDraftBase=String(editsVersion);
  writeDraft('edits',editsDraftBase,{edits:userEdits,pref:preferences});persistToServer();
}
async function initServerStorage() {
  personalReady=false;setSaveState('edits','saving','正在读取个人数据…');
  try {
    apiBase = await detectApiBase();
    if (apiBase === null) throw new Error('no server');
    const res = await fetch(apiBase + '/api/edits');
    if (!res.ok) throw new Error('bad status');
    const payload = await res.json();
    if(!payload||!isPlainObject(payload.edits)||!isPlainObject(payload.pref)||typeof payload.version!=='string')throw new Error('invalid payload');
    const diskEdits = payload.edits;
    editsVersion = payload.version;
    serverMode = true;
    const ownDraft=readOwnDraft('edits'),legacyRaw=ownDraft?null:localStorage.getItem(LEGACY_DRAFT_KEY.edits),legacyDraft=ownDraft?null:readLegacyDraft('edits'),draft=ownDraft||(legacyDraft?migrateLegacyDraft('edits',legacyDraft,legacyRaw):null);
    if(draft&&isPlainObject(draft.data.edits)&&isPlainObject(draft.data.pref)){
      userEdits=draft.data.edits;preferences={...DEFAULT_PREF,...draft.data.pref};editsDraftBase=String(draft.base);editsDirty=true;editsConflict=editsDraftBase!==String(payload.version);
      setSaveState('edits',editsConflict?'conflict':'error',editsConflict?'个人草稿基于旧版本，请先导出':'发现可重试的个人数据草稿');
    }else{
      userEdits = diskEdits;preferences = {...DEFAULT_PREF, ...payload.pref};editsDraftBase=null;
      localStorage.setItem('toudiEdits', JSON.stringify(userEdits));
      localStorage.setItem('toudiPref', JSON.stringify(preferences));
      setSaveState('edits','idle','');
    }
    reapplyEdits();
    personalReady=true;buildFilterPanel(); render();
  } catch(e) { serverMode = false; apiBase = null; setReadError('edits','本地数据读取失败'); }
  updateStorageBadge();
}
async function detectApiBase() {
  if(window.__SNAPSHOT__||window.__WORKSPACE_DISCONNECTED__||!['127.0.0.1','localhost','[::1]'].includes(location.hostname))return null;
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),1500);
  try{const r=await fetch('/api/edits',{signal:ctrl.signal});return r.ok?'':null;}catch(e){return null;}finally{clearTimeout(timer);}
}

function reapplyEdits() {
  data.forEach((item)=>{ const e=userEdits[item._key]||{};
    item._status=e.status||'未投递'; item._note=e.note||'';
    item._starred=!!e.starred; item._excluded=!!e.excluded; item._research=!!e.research; item._researchNote=e.researchNote||'';
    applyFieldOverrides(item, e.fields||{}); });
}
// 字段覆盖：只改显示值，原始抓取数据保留在 item._rawF 中，覆盖删除后自动还原
function applyFieldOverrides(item, f){
  if(!item._rawF)item._rawF={};
  Object.keys(f).forEach(k=>{ if(!(k in item._rawF))item._rawF[k]=item[k]; if(f[k])item[k]=f[k]; });

async function flushEdits(){

      body:JSON.stringify({edits:sentDraft.data.edits,pref:sentDraft.data.pref,base:sentDraft.base})});
    const body=await res.json().catch(()=>null);

    if(!res.ok)throw new Error((body&&body.error)||`HTTP ${res.status}`);

    editsVersion=body.version;
    if(editsSaveGeneration===sentGeneration){editsDirty=false;editsDraftBase=null;localStorage.setItem('toudiEdits',JSON.stringify(userEdits));localStorage.setItem('toudiPref',JSON.stringify(preferences));clearOwnDraft('edits',sentRevision);clearLegacySourceAfterSave(sentDraft);setSaveState('edits','saved','个人数据已保存');}
    else{editsDraftBase=body.version;advanceOwnDraftBase('edits',sentRevision,body.version);setSaveState('edits','saving','个人数据仍在保存…');}
  }catch(e){setSaveState('edits','error','个人数据保存失败 · 草稿已保留');showToast('保存失败；点击保存状态可重试或导出草稿');}
  finally{
    editsSaveInFlight=false;

  }
}

// ============== DEADLINE PARSING ==============
function parseDeadline(dl) {
  if (!dl) return { type:'none', text:'', days:null };
  if (dl.includes('招满') || dl.includes('尽快')) return { type:'rolling', text:'招满即止', days:null };
  let m = dl.match(/(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})/);
  if (m) { const d = new Date(+m[1],+m[2]-1,+m[3]); return { type:'date', text:dl, date:d, days:Math.ceil((d-TODAY)/86400000) }; }
  m = dl.match(/(\d{4})[.\/-](\d{1,2})(?![.\/-]\d)/);
  if (m) { const d = new Date(+m[1],+m[2],0); return { type:'month', text:dl, date:d, days:Math.ceil((d-TODAY)/86400000) }; }
  return { type:'other', text:dl, days:null };
}

// ============== QUICK VIEWS ==============
function matchQV(item, qvId) {
  if (qvId==='research') return !!item._research;
  if (qvId==='excluded') return !!item._excluded;
  if (item._excluded) return false;
  const dl = item._deadline;
  switch(qvId) {
    case 'all': return true;
    case 'urgent': return dl.type==='date' && dl.days >= 0 && dl.days <= 7;
    case 'expired': return (dl.type==='date'||dl.type==='month') && dl.days < 0;
    case 'recent': {
      const rd = item['录入时间']||'';
      const m = rd.match(/(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})/);
      return m ? (TODAY - new Date(+m[1],+m[2]-1,+m[3])) <= 7*86400000 : false;
    }
    case 'starred': return item._starred;
    case 'recommended': {
      if(item._research) return false;
      const nature = item['性质']||'';
      const industry = item['行业']||'';
      const edu = item['学历要求']||'';
      const natureMatch = preferences.natures.some(n => nature.includes(n));
      const industryMatch = preferences.industries.some(i => industry.includes(i));
      const eduMatch = !edu || preferences.education.some(e => edu.includes(e) || e === '');
      return (natureMatch || industryMatch) && eduMatch;
    }
    case 'inProgress': return ['已投递','笔试','面试'].includes(item._status);
    default: return true;
  }
}

const FILTER_DEFS = [
  { key:'校招类型', label:'校招类型', field:'校招类型' },
  { key:'性质', label:'企业性质', field:'性质' },
  { key:'地点', label:'地点', field:'地点', split:'/' },
  { key:'学历要求', label:'学历要求', field:'学历要求' },
  { key:'_status', label:'进度', field:'_status', custom: STATUSES },
];

function filterValuesForItem(item,key) {
  if(key==='_deadlineBucket'){const dl=item._deadline;if(dl.days!==null)return [dl.days<0?'已过期':dl.days<=7?'7天内':dl.days<=14?'8—14天':'14天后'];return [dl.type==='rolling'?'招满即止':'日期待核实'];}
  if(key==='_status')return [STATUSES.includes(item._status)?item._status:UNKNOWN_STATUS];
  if(key==='_industry')return [(item['行业']||'').split('/')[0].trim()||'其他'];
  if(key==='地点')return [...new Set((item['地点']||'').split(/[\/、,，；;\s]+/).map(s=>s.trim()).filter(Boolean))];
  return [item[key]||''];
}

function matchesFilterState(item,filterState,skipFilterKey=null) {
  for(const [key,values] of Object.entries(filterState||{})){
    if(key===skipFilterKey||!values.length)continue;
    const itemValues=filterValuesForItem(item,key);
    if(!values.some(v=>itemValues.includes(v)))return false;
  }
  return true;
}

function queryRecords({qv=currentQV,query=searchQuery,filterState=filters,skipFilterKey=null}={}) {
  const needle=(query||'').trim().toLowerCase();
  return data.filter(item=>{
    if(!matchQV(item,qv))return false;
    if(needle){
      const sourceText=(item['归并来源']||[]).map(src=>[src['名称'],src['岗位'],src['行业'],src['地点']].filter(Boolean).join(' ')).join(' ');
      const hay=(item['名称']+' '+item['岗位']+' '+item['行业']+' '+item['地点']+' '+item['性质']+' '+item['校招类型']+' '+item['截止时间']+' '+(item._researchNote||'')+' '+sourceText).toLowerCase();
      if(!hay.includes(needle))return false;
    }
    return matchesFilterState(item,filterState,skipFilterKey);
  });
}

function filterOptions(key,customValues=null) {
  let values=customValues?[...customValues]:[...new Set(data.flatMap(item=>filterValuesForItem(item,key)).filter(Boolean))];
  if(key==='_status'&&(data.some(item=>!STATUSES.includes(item._status))||(filters._status||[]).includes(UNKNOWN_STATUS)))values.push(UNKNOWN_STATUS);
  values=[...new Set(values)];
  const base=queryRecords({skipFilterKey:key});
  const counts=new Map(values.map(value=>[value,0]));
  base.forEach(item=>new Set(filterValuesForItem(item,key)).forEach(value=>{if(counts.has(value))counts.set(value,counts.get(value)+1);}));
  return values.map(value=>[value,counts.get(value)||0])
    .sort((a,b)=>customValues?values.indexOf(a[0])-values.indexOf(b[0]):b[1]-a[1]||a[0].localeCompare(b[0],'zh-CN'));
}

function buildFilterPanel() {
  if(document.getElementById("filterModal")?.style.display!=="flex")return;
  const panel = document.getElementById('filterPanel');
  const collapsed=new Set([...panel.querySelectorAll('.filter-group.collapsed')].map(x=>x.dataset.group));
  const focused=document.activeElement?.matches?.('#filterPanel input')?{key:document.activeElement.dataset.filter,value:document.activeElement.value}:null;
  let html = '<div class="sb-section-title">筛选</div>';
  html += buildFilterGroup('行业大类','_industry',filterOptions('_industry'));
  FILTER_DEFS.forEach(def => {
    const values=filterOptions(def.key,def.custom||null);
    if (values.length > 0) html += buildFilterGroup(def.label, def.key, values);
  });
  panel.innerHTML = html;
  collapsed.forEach(key=>panel.querySelector(`.filter-group[data-group="${key}"]`)?.classList.add('collapsed'));
  if(focused)panel.querySelector(`input[data-filter="${focused.key}"][value="${CSS.escape(focused.value)}"]`)?.focus({preventScroll:true});
}

function buildFilterGroup(label, key, values) {
  let html = `<div class="filter-group" data-group="${key}"><h3 onclick="this.parentElement.classList.toggle('collapsed')">${label} <span class="toggle">▾</span></h3><div class="filter-items">`;

    const checked = (filters[key]||[]).includes(val) ? 'checked' : '';
    html += `<label class="filter-item"><input type="checkbox" value="${esc(val)}" data-filter="${key}" ${checked} onchange="onFilterChange(this)"> ${esc(truncate(val,18))} <span class="count">${count}</span></label>`;
  });
  return html + '</div></div>';
}

// ============== FILTERING & SORTING ==============
function getFiltered() {
  return queryRecords().sort((a,b) => {
    if (!sortField && currentQV==='urgent') {
      const da = a._deadline.days??9999, db = b._deadline.days??9999;
      return da - db;
    }
    if (!sortField) return 0;
    if (sortField==='_deadline') {
      const da=a._deadline.days??(sortAsc?9999:-9999), db=b._deadline.days??(sortAsc?9999:-9999);
      return sortAsc?da-db:db-da;
    }
    if (sortField==='录入时间') {
      const pd = s => { const m=(s||'').match(/(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})/); return m ? new Date(+m[1],+m[2]-1,+m[3]).getTime() : 0; };
      const ta=pd(a['录入时间']), tb=pd(b['录入时间']);
      return sortAsc ? ta-tb : tb-ta;
    }
    const va=(a[sortField]||'').toString(), vb=(b[sortField]||'').toString();
    return sortAsc ? va.localeCompare(vb,'zh-CN') : -va.localeCompare(vb,'zh-CN');
  });
}

    </tr>`;
  }).join('');

  if(!filtered.length)tbody.innerHTML='<tr><td class="table-empty" colspan="17"><p>当前条件没有匹配记录</p><button class="btn btn-sm" onclick="clearAdditional()">清除附加条件</button> <button class="btn btn-sm" onclick="resetFilters()">重置全部</button></td></tr>';

}


function renderDeadlineBadge(dl) {
  if (dl.type==='none') return '<span class="deadline-badge deadline-none">无</span>';
  if (dl.type==='rolling') return '<span class="deadline-badge deadline-none">招满即止</span>';
  if (dl.type==='month') return `<span class="deadline-badge deadline-medium" title="${esc(dl.text)}（仅注明月份，不推定具体日期）">${esc(truncate(dl.text,12))}<span class="deadline-days">仅月份</span></span>`;
  if (dl.days===null) return `<span class="deadline-badge deadline-none" title="${esc(dl.text)}">${esc(truncate(dl.text,10)||'详见公告')}</span>`;
  const text=esc(truncate(dl.text,12));
  if (dl.days<0) return `<span class="deadline-badge deadline-expired" title="${esc(dl.text)}">${text}</span>`;
  if (dl.days===0) return `<span class="deadline-badge deadline-critical" title="${esc(dl.text)}">${text}<span class="deadline-days">今天!</span></span>`;
  if (dl.days<=3) return `<span class="deadline-badge deadline-critical" title="${esc(dl.text)}">${text}<span class="deadline-days">${dl.days}天</span></span>`;
  if (dl.days<=7) return `<span class="deadline-badge deadline-high" title="${esc(dl.text)}">${text}<span class="deadline-days">${dl.days}天</span></span>`;
  if (dl.days<=14) return `<span class="deadline-badge deadline-medium" title="${esc(dl.text)}">${text}<span class="deadline-days">${dl.days}天</span></span>`;
  return `<span class="deadline-badge deadline-low" title="${esc(dl.text)}">${text}<span class="deadline-days">${dl.days}天</span></span>`;
}

function renderActiveFilters() {

function removeFilter(key, value) {
  if (filters[key]) { filters[key]=filters[key].filter(v=>v!==value); if(!filters[key].length) delete filters[key]; }
  document.querySelectorAll(`#filterPanel input[data-filter="${key}"]`).forEach(cb => { if(cb.value===value) cb.checked=false; });
  selected.clear();currentPage=1; render();

function renderPagination(total, totalPages) {
  const el = document.getElementById('pagination');
  let html = `<button class="page-btn" onclick="goPage(1)" ${currentPage===1?'disabled':''}>«</button><button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  const range=2, pages=[];
  for(let i=Math.max(1,currentPage-range);i<=Math.min(totalPages,currentPage+range);i++) pages.push(i);
  if(pages[0]>1){html+=`<button class="page-btn" onclick="goPage(1)">1</button>`;if(pages[0]>2)html+='<span class="page-info">…</span>';}
  pages.forEach(p=>{html+=`<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;});
  if(pages[pages.length-1]<totalPages){if(pages[pages.length-1]<totalPages-1)html+='<span class="page-info">…</span>';html+=`<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;}
  html+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${total===0||currentPage>=totalPages?'disabled':''}>›</button><button class="page-btn" onclick="goPage(${totalPages})" ${total===0||currentPage>=totalPages?'disabled':''}>»</button>`;
  html+=`<span class="page-info">每页</span><select class="page-size-select" onchange="pageSize=+this.value;workspace.pageSize=pageSize;saveWorkspace();currentPage=1;render()">${[20,50,100,200].map(s=>`<option value="${s}" ${s===pageSize?'selected':''}>${s}</option>`).join('')}</select>`;
  el.innerHTML = html;
}

function goPage(p) {
  const f=getFiltered(); const tp=Math.ceil(f.length/pageSize);
  currentPage=Math.max(1,Math.min(p,tp)); render();
  document.querySelector('.content').scrollTop=0;
}

function showStatusDropdown(event,idx) {
  event.stopPropagation();closeStatusDropdown();
  const rect=event.target.getBoundingClientRect();
  const dd=document.createElement('div');dd.className='status-dropdown';dd.id='statusDropdown';
  dd.style.left=Math.min(rect.left,window.innerWidth-150)+'px';dd.style.top=(rect.bottom+4)+'px';
  STATUSES.forEach(s=>{const opt=document.createElement('div');opt.className='status-option';opt.innerHTML=`<span class="status-dot" style="background:${STATUS_COLORS[s]}"></span>${s}`;opt.onclick=()=>{setStatus(idx,s);closeStatusDropdown();};dd.appendChild(opt);});
  document.body.appendChild(dd);
  dd.style.top=Math.max(8,Math.min(rect.bottom+4,window.innerHeight-dd.offsetHeight-8))+'px';
  dd.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-dd.offsetWidth-8))+'px';
  setTimeout(()=>document.addEventListener('click',closeStatusDropdown),0);
}

// ============== EXCLUDE (不适合) ==============
// 公司级语义（2026-09-03 起）：同名公司所有行同步标记/恢复——用户按「公司」理解不适合，
// 同名新增行（不同公众号来源）不得漏标后"死灰复燃"（当日丢标事故）
function toggleExclude(idx){
  if(!personalMutationAllowed())return;
  const it=byId(idx);if(!it)return;
  const flag=!editForItem(it).excluded;
  data.forEach(o=>{ if(o['名称']!==it['名称'])return; const oe=editForItem(o); oe.excluded=flag; o._excluded=flag; });
  saveEdits();render();
  showToast(flag?`已标记「${it['名称']}」，正在保存…`:`已恢复「${it['名称']}」，正在保存…`);
}
function batchExclude(flag){
  if(!personalMutationAllowed())return;
  const names=new Set();
  selected.forEach(idx=>{const it=byId(idx);if(it)names.add(it['名称']);});
  let count=0;
  data.forEach(o=>{ if(!names.has(o['名称']))return; const e=editForItem(o); e.excluded=flag; o._excluded=flag; count++; });
  saveEdits();selected.clear();updateBatchBar();render();
  showToast(flag?`已修改 ${count} 条，正在保存…`:`已恢复 ${count} 条，正在保存…`);
}

// ============== CHARTS ==============
function renderCharts(active=getFiltered()){
  const grid=document.getElementById('chartsGrid');grid.innerHTML='';
  // Current status only: a record belongs to exactly one bucket.
  const sc={};STATUSES.forEach(s=>sc[s]=0);let unknownCount=0;
  active.forEach(d=>STATUSES.includes(d._status)?sc[d._status]++:unknownCount++);
  if(unknownCount)sc[UNKNOWN_STATUS]=unknownCount;
  addBarChart(grid,'投递进度',sc,{...STATUS_COLORS,[UNKNOWN_STATUS]:UNKNOWN_STATUS_COLOR},{keepZero:true,preserveOrder:true,statusDrilldown:true});
  // Deadline
  const urg={'已过期':0,'今天':0,'1–3天':0,'4–7天':0,'8–14天':0,'15–30天':0,'超30天':0,'仅注明月份':0,'招满即止':0,'未注明':0,'无法解析':0};
  active.forEach(item=>{const dl=item._deadline;if(dl.type==='rolling')urg['招满即止']++;else if(dl.type==='none')urg['未注明']++;else if(dl.type==='month')urg['仅注明月份']++;else if(dl.days===null)urg['无法解析']++;else if(dl.days<0)urg['已过期']++;else if(dl.days===0)urg['今天']++;else if(dl.days<=3)urg['1–3天']++;else if(dl.days<=7)urg['4–7天']++;else if(dl.days<=14)urg['8–14天']++;else if(dl.days<=30)urg['15–30天']++;else urg['超30天']++;});
  addBarChart(grid,'截止时间分布',urg,Object.fromEntries(Object.keys(urg).map(label=>[label,['已过期','今天','1–3天','4–7天','8–14天'].includes(label)?'var(--warning)':'var(--primary)'])),{keepZero:true,preserveOrder:true});
  // Nature
  const nc={};active.forEach(d=>{const n=d['性质']||'未知';nc[n]=(nc[n]||0)+1;});
  addBarChart(grid,'企业性质分布',nc,null,{emptyText:'当前结果没有企业性质数据'});
  // Industry
  const ic={};active.forEach(d=>{const c=(d['行业']||'').split('/')[0].trim()||'其他';ic[c]=(ic[c]||0)+1;});
  addBarChart(grid,'行业分布 TOP10',Object.fromEntries(Object.entries(ic).sort((a,b)=>b[1]-a[1]).slice(0,10)),null,{emptyText:'当前结果没有行业数据'});
  // City
  const cc={};active.forEach(d=>{new Set((d['地点']||'').split(/[\/、,，；;\s]+/).map(c=>c.trim()).filter(Boolean)).forEach(c=>cc[c]=(cc[c]||0)+1);});
  addBarChart(grid,'城市分布 TOP10',Object.fromEntries(Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,10)),null,{emptyText:'当前结果没有城市数据'});
  // Type
  const tc={};active.forEach(d=>{const t=d['校招类型']||'未知';tc[t]=(tc[t]||0)+1;});
  addBarChart(grid,'校招类型分布',tc,null,{emptyText:'当前结果没有校招类型数据'});
}

function addBarChart(container,title,counts,colorMap,options={}){
  let entries=Object.entries(counts);
  if(!options.keepZero)entries=entries.filter(([,v])=>v>0);
  if(!options.preserveOrder)entries.sort((a,b)=>b[1]-a[1]);
  const max=Math.max(0,...entries.map(([,v])=>v));
  const card=document.createElement('div');card.className='chart-card';
  card.innerHTML=`<h3>${title}</h3>${options.note?`<p class="chart-note">${esc(options.note)}</p>`:''}<div class="bar-chart">${entries.length?entries.map(([label,val],i)=>{
    const pct=max?val/max*100:0;
    const color=colorMap?(colorMap[label]||CHART_COLORS[i%CHART_COLORS.length]):CHART_COLORS[i%CHART_COLORS.length];
    const tag=options.statusDrilldown&&val>0?'button':'div';
    const action=options.statusDrilldown&&val>0?` type="button" onclick="filterByStatus('${label}')" data-status="${label}" data-count="${val}"`:'';
    return`<${tag} class="bar-row ${options.statusDrilldown&&val>0?'bar-action':''}"${action}><span class="bar-label" title="${esc(label)}">${esc(truncate(label,12))}</span><span class="bar-track"><span class="bar-fill" style="width:${pct}%;background:${color}"></span></span><span class="bar-value">${val}</span></${tag}>`;
  }).join(''):`<div class="chart-empty">${esc(options.emptyText||'当前结果为空')}</div>`}</div>`;
  container.appendChild(card);
}

// 数据源：面试复盘数据.json（脚本/6_复盘导入.py 从 仓库流程契约 产出的详版 md 解析入库）
// 页内编辑只改 JSON 工作副本；md 归档原件不动。
let reviewData={sessions:[]}, currentReviewId=null, reviewTab='sessions', reviewSearch='', reviewSaveTimer=null;
let reviewVersion='0', reviewDraftBase=null, reviewSaveGeneration=0, reviewSaveInFlight=false, reviewDirty=false, reviewConflict=false;
let rvEdit={q:0,meta:false,intel:false,summary:false}, openQs=new Set();
const RV_STATUS_COLORS={'复发':'var(--warning)','新增':'var(--warning)','改善':'var(--primary)','已克服':'var(--primary)','未考察':'var(--text3)','未出现':'var(--text3)','待观察':'var(--text3)'};
const RV_STATUSES=['新增','复发','改善','已克服','未考察','待观察'];

function loadReviewsCache(){const d=cachedData("toudiReviews");if(d&&Array.isArray(d.sessions))reviewData=d;}
function reviewFormEditing(){return !!(rvEdit.q||rvEdit.meta||rvEdit.intel||rvEdit.summary);}
function saveReviews(){if(window.__SNAPSHOT__){showToast("此快照仅供阅读，请在电脑端修改");return;}
  if(apiBase===null){localStorage.setItem('toudiReviews',JSON.stringify(reviewData));return;}
  if(reviewDraftBase===null)reviewDraftBase=String(reviewVersion);
  writeDraft('reviews',reviewDraftBase,{sessions:reviewData.sessions});persistReviews();
}
function persistReviews(){
  if(apiBase===null)return;
  reviewDirty=true;
  if(reviewConflict){setSaveState('reviews','conflict','复盘冲突 · 草稿仍在本页');return;}
  reviewSaveGeneration++;setSaveState('reviews','saving','复盘保存中…');
  clearTimeout(reviewSaveTimer);
  reviewSaveTimer=setTimeout(flushReviews,400);
}
async function flushReviews(){
  clearTimeout(reviewSaveTimer);reviewSaveTimer=null;
  if(reviewSaveInFlight||!reviewDirty||reviewConflict||apiBase===null)return;
  reviewSaveInFlight=true;const sentGeneration=reviewSaveGeneration;const sentDraft=readOwnDraft('reviews');
  if(!sentDraft){reviewSaveInFlight=false;setSaveState('reviews','error','复盘草稿缺失，未发送');return;}
  const sentRevision=sentDraft.revision;
  try{
    const res=await fetch(apiBase+'/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessions:sentDraft.data.sessions,base:sentDraft.base})});
    const body=await res.json().catch(()=>null);
    if(res.status===409){reviewConflict=true;setSaveState('reviews','conflict','复盘冲突 · 草稿仍在本页');showToast('复盘已在别处更新；点击保存状态可导出未提交草稿');return;}
    if(!res.ok)throw new Error((body&&body.error)||`HTTP ${res.status}`);
    if(!body||body.ok!==true||typeof body.version!=='string')throw new Error('invalid save acknowledgement');
    reviewVersion=body.version;
    if(reviewSaveGeneration===sentGeneration){reviewDirty=false;reviewDraftBase=null;localStorage.setItem('toudiReviews',JSON.stringify(reviewData));clearOwnDraft('reviews',sentRevision);clearLegacySourceAfterSave(sentDraft);setSaveState('reviews','saved','复盘已保存');}
    else{reviewDraftBase=body.version;advanceOwnDraftBase('reviews',sentRevision,body.version);setSaveState('reviews','saving','复盘仍在保存…');}
  }catch(e){setSaveState('reviews','error','复盘保存失败 · 草稿已保留');showToast('复盘保存失败；点击保存状态可重试');}
  finally{reviewSaveInFlight=false;if(reviewDirty&&reviewSaveGeneration>sentGeneration&&!reviewConflict)setTimeout(flushReviews,0);}
}
async function initReviewsStorage(){
  if(reviewDirty||reviewConflict||reviewFormEditing())return;
  const ownDraft=readOwnDraft('reviews'),legacyRaw=ownDraft?null:localStorage.getItem(LEGACY_DRAFT_KEY.reviews),legacyDraft=ownDraft?null:readLegacyDraft('reviews'),draft=ownDraft||(legacyDraft?migrateLegacyDraft('reviews',legacyDraft,legacyRaw):null);
  if(apiBase===null){if(draft&&Array.isArray(draft.data.sessions)){reviewData={sessions:draft.data.sessions};reviewDraftBase=String(draft.base);reviewDirty=true;setSaveState('reviews','error','发现未提交的复盘草稿');if(view==='review')renderReview();}else loadReviewsCache();return;}
  const startedGeneration=reviewSaveGeneration;
  try{
    const res=await fetch(apiBase+'/api/reviews');
    if(!res.ok)throw new Error('bad status');
    const payload=(await res.json())||{};
    if(reviewDirty||reviewConflict||reviewFormEditing()||reviewSaveGeneration!==startedGeneration)return;
    if(!Array.isArray(payload.sessions)||typeof payload.version!=='string')throw new Error('invalid payload');
    reviewVersion=payload.version;
    if(draft&&Array.isArray(draft.data.sessions)){
      reviewData={sessions:draft.data.sessions};reviewDraftBase=String(draft.base);reviewDirty=true;reviewConflict=reviewDraftBase!==String(payload.version);
      setSaveState('reviews',reviewConflict?'conflict':'error',reviewConflict?'复盘草稿基于旧版本，请先导出':'发现可重试的复盘草稿');
    }else{
      reviewDraftBase=null;reviewData.sessions=payload.sessions;localStorage.setItem('toudiReviews',JSON.stringify(reviewData));setSaveState('reviews','idle','');
    }
  }catch(e){setReadError('reviews','复盘数据读取失败');}
  if(view==='review')renderReview();
}

  }

  const ci=(sum.commonIssues||[]).map(c=>`<div style="margin-bottom:6px"><span class="rv-pill rv-pill-复发" style="background:var(--primary-light);color:var(--primary)">${esc(c.name)}</span>${c.evidence?` <span style="font-size:11px;color:var(--text3)">${esc(c.evidence)}</span>`:''}</div>`).join('');
  return `<div class="rv-panel">${head}

    ${ci&&!sum.raw?`<div class="rv-sec"><div class="rv-sec-label">本场共性问题</div>${ci}</div>`:''}
    ${!bars&&!sum.hotspots&&!ci?'<div class="rv-sec-body">—</div>':''}</div>`;

// ---- 弱项追踪总表（跨场次聚合，只读；编辑请到对应场次的纵向追踪面板） ----
function renderWeakness(){
  const main=document.getElementById('reviewMain');
  const agg={};
  [...reviewData.sessions].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(s=>{
    (s.tracking||[]).forEach(t=>{if(!t.weakness)return;
      if(!agg[t.weakness])agg[t.weakness]={name:t.weakness,first:s,timeline:[]};
      agg[t.weakness].timeline.push({s,status:t.status||'',evidence:t.evidence||''});});
  });
  const items=Object.values(agg);
  if(!items.length){main.innerHTML='<div class="rv-panel rv-empty">暂无弱项追踪数据。</div>';return;}
  items.sort((a,b)=>(b.timeline[b.timeline.length-1].s.date||'').localeCompare(a.timeline[a.timeline.length-1].s.date||''));
  main.innerHTML=`<div class="rv-panel"><div class="rv-panel-head"><h3>弱项追踪总表（${items.length} 项 · 按各场次纵向追踪聚合）</h3></div>
    <table class="rv-table"><thead><tr><th style="width:20%">弱项</th><th style="width:26%">首次出现</th><th style="width:12%">最近状态</th><th>场次轨迹（旧→新，点击查看场次）</th></tr></thead><tbody>
    ${items.map(a=>{const latest=a.timeline[a.timeline.length-1];
      return `<tr><td style="font-weight:600">${esc(a.name)}</td>
        <td style="font-size:12px;color:var(--text2)">${esc(a.first.date||'')} ${esc(a.first.company||'')}${a.first.round?'·'+esc(a.first.round):''}</td>
        <td><span class="rv-pill rv-pill-${latest.status||'未考察'}">${esc(latest.status||'—')}</span></td>
        <td><span class="rv-tl">${a.timeline.map(t=>`<span class="rv-tl-dot" style="background:${RV_STATUS_COLORS[t.status]||'#d1d5db'};cursor:pointer" title="${esc(t.s.date||'')} ${esc(t.s.company||'')}${t.s.round?'·'+esc(t.s.round):''}：${t.status||'—'}${t.evidence?'（'+esc(t.evidence)+'）':''}" onclick="openReviewSession('${t.s.id}')"></span>`).join('')}</span></td></tr>`;
    }).join('')}</tbody></table></div>`;
}

let prospectData={prospects:[]}, currentProspectId=null, prospectSearch='', prospectScope='all', prospectOrder='newest', prospectLoadError='', prospectSideCollapsed=localStorage.getItem('prospectSideCollapsed')==='1';
function loadProspectsCache(){const d=cachedData("toudiProspects");if(d&&Array.isArray(d.prospects))prospectData=d;}
async function initProspectsStorage(){
  loadProspectsCache();if(apiBase===null)return;
  try{
    const res=await fetch(apiBase+'/api/prospects');const disk=await res.json();
    if(!res.ok||disk.schemaVersion!==1||!Array.isArray(disk.prospects))throw new Error(disk.error||'探查目录加载失败');
    prospectData=disk;prospectLoadError='';localStorage.setItem('toudiProspects',JSON.stringify(prospectData));
  }catch(e){prospectLoadError=e.message;}
  if(view==='prospect')renderProspect();
}
function prospectById(id){return prospectData.prospects.find(p=>p.id===id);}
function prospectVisible(){
  const q=prospectSearch.trim().toLowerCase();
  return prospectData.prospects.filter(p=>(prospectScope==='all'||(prospectScope==='pending'?p.status!=='已探查':!!p.filename))&&(!q||[p.company,p.title,p.researchedAt,(p.aliases||[]).join(' '),p.content].join(' ').toLowerCase().includes(q))).slice().sort((a,b)=>{
    if(prospectOrder==='company')return a.company.localeCompare(b.company,'zh-CN');
    if(!a.researchedAt||!b.researchedAt)return a.researchedAt?-1:b.researchedAt?1:a.company.localeCompare(b.company,'zh-CN');
    return (prospectOrder==='oldest'?1:-1)*a.researchedAt.localeCompare(b.researchedAt)||a.company.localeCompare(b.company,'zh-CN');
  });
}
function toggleProspectSide(){prospectSideCollapsed=!prospectSideCollapsed;localStorage.setItem('prospectSideCollapsed',prospectSideCollapsed?'1':'0');document.getElementById('prospectSide').classList.toggle('rv-collapsed',prospectSideCollapsed);updateDirectoryControls();}
function openProspect(id){saveViewScroll();currentProspectId=id;if(view!=='prospect')switchView('prospect');else renderProspect();}
function renderProspect(){
  const oldPosition=captureReaderPosition('prospectMain');
  const side=document.getElementById('prospectSide');if(side)side.classList.toggle('rv-collapsed',!!prospectSideCollapsed);
  const list=prospectVisible();if(!list.some(p=>p.id===currentProspectId))currentProspectId=list[0]?.id||null;
  renderProspectSide(document.getElementById('prospectList'),list);
  renderProspectMain(document.getElementById('prospectMain'));updateTopbarTitle();retainReaderPosition('prospectMain',oldPosition);updateDirectoryControls();
}
function renderProspectSide(el,list=prospectVisible()){
  if(!el)return;
  const rc=document.getElementById('prospectRailCount');if(rc)rc.textContent=prospectData.prospects.length+' 家';

// ============== 阅读辅助：目录 / 搜索高亮 / 滚动位置 / 焦点刷新 ==============
function buildTocHtml(rootEl){
  if(!rootEl)return '';
  const headings=Array.from(rootEl.querySelectorAll('[id^="toc-"]')).filter(h=>h.id&&h.textContent.trim());
  if(!headings.length)return '';
  const items=headings.map(h=>{
    const text=h.textContent.trim();
    const cls=['rv-toc-item'];
    if(h.classList.contains('md-h3'))cls.push('l2');
    if(h.classList.contains('md-h4')||h.classList.contains('md-h5')||h.classList.contains('md-h6'))cls.push('l3');
    return `<span class="${cls.join(' ')}" onclick="scrollReaderTo(document.getElementById('${h.id}'))">${esc(text)}</span>`;
  }).join('');
  return `<details class="rv-toc-inline"><summary>目录</summary><div class="rv-toc-items">${items}</div></details>`;
}
function clearHighlight(root){
  if(!root)return;
  if(window.CSS&&CSS.highlights){try{CSS.highlights.delete('search-match');}catch(e){}}
  root.querySelectorAll('mark.search-match').forEach(m=>{
    const parent=m.parentNode;parent.replaceChild(document.createTextNode(m.textContent),m);parent.normalize();
  });
}
function highlightSearch(root, term){
  if(!root)return; clearHighlight(root);
  if(!term)return;
  const t=term.toLowerCase();
  const ranges=[];
  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  const nodes=[]; let n; while((n=walker.nextNode()))nodes.push(n);
  if(window.CSS&&CSS.highlights){
    nodes.forEach(node=>{
      const text=node.textContent; let pos=text.toLowerCase().indexOf(t); const len=term.length;
      while(pos!==-1){
        const r=document.createRange(); r.setStart(node,pos); r.setEnd(node,pos+len); ranges.push(r);
        pos=text.toLowerCase().indexOf(t,pos+len);
      }
    });
    if(ranges.length){const h=new Highlight(...ranges); if(CSS.highlights)CSS.highlights.set('search-match',h);}
  }else{
    nodes.forEach(node=>{
      const text=node.textContent; let pos=text.toLowerCase().indexOf(t); const len=term.length;
      if(pos===-1)return;
      const frag=document.createDocumentFragment(); let last=0;
      while(pos!==-1){
        frag.appendChild(document.createTextNode(text.slice(last,pos)));
        const mark=document.createElement('mark'); mark.className='search-match'; mark.textContent=text.slice(pos,pos+len);
        frag.appendChild(mark); last=pos+len; pos=text.toLowerCase().indexOf(t,last);
      }
      frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag,node);
    });
  }
}

// ---- mini markdown 渲染（先整体转义，再解析白名单语法；不识别的原样显示）----
function mdInline(s){
  let t=esc(s);
  t=t.replace(/`([^`]+)`/g,'<code class="md-code">$1</code>');
  t=t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,label,href)=>{
    if(/&(?:#|colon;|tab;|newline;)/i.test(href)||/^(?!https?:|mailto:)[a-z][a-z0-9+.-]*:/i.test(href))return label;
    return '<a href="'+href+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
  });
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  return t;
}
function mdTable(rows){
  const cells=r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>mdInline(c.trim()));
  let html='<table class="md-table"><thead><tr>'+cells(rows[0]).map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';
  for(let i=2;i<rows.length;i++)html+='<tr>'+cells(rows[i]).map(c=>`<td>${c}</td>`).join('')+'</tr>';
  return html+'</tbody></table>';
}
function mdList(buf){
  let html='',stack=[];
  const close=to=>{while(stack.length&&stack[stack.length-1].indent>=to)html+=`</${stack.pop().tag}>`;};
  buf.forEach(l=>{
    const m=l.match(/^(\s*)([-*+]|\d+[.、)])\s+(.*)$/);
    if(!m){html+=`<div class="md-li-cont">${mdInline(l.trim())}</div>`;return;}  // 续行/松散行
    const indent=m[1].length, tag=/\d/.test(m[2][0])?'ol':'ul';
    if(stack.length&&stack[stack.length-1].indent>indent)close(indent+1);
    if(stack.length&&stack[stack.length-1].indent===indent&&stack[stack.length-1].tag!==tag){html+=`</${stack.pop().tag}>`;}
    if(!stack.length||stack[stack.length-1].indent<indent||stack[stack.length-1].indent===indent&&stack[stack.length-1].tag!==tag){html+=`<${tag} class="md-list">`;stack.push({indent,tag});}
    html+=`<li>${mdInline(m[3])}</li>`;
  });
  close(-1);
  return html;
}
function renderMd(src, opts){
  opts=opts||{};
  if(!src)return '';
  const lines=String(src).replace(/\r\n?/g,'\n').split('\n');
  let html='',i=0;
  const used={};
  const slug=(text)=>{
    let s=esc(text).replace(/<[^>]+>/g,'').trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'')||'heading';
    if(used[s]){used[s]++;s=s+'-'+used[s];}else{used[s]=1;}
    return s;
  };
  while(i<lines.length){
    const line=lines[i];
    if(/^\s*```/.test(line)){let buf=[];i++;while(i<lines.length&&!/^\s*```/.test(lines[i])){buf.push(lines[i]);i++;}i++;
      html+=`<pre class="md-pre"><code>${esc(buf.join('\n'))}</code></pre>`;continue;}
    if(/^\s*\|.*\|\s*$/.test(line)&&i+1<lines.length&&/^\s*\|[\s:\-|]+\|\s*$/.test(lines[i+1])){
      let rows=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i]);i++;}
      html+=mdTable(rows);continue;}
    let m=line.match(/^(#{1,6})\s+(.*)$/);
    if(m){const id=opts.toc!==false?` id="toc-${slug(m[2])}"`:'';html+=`<div class="md-h md-h${m[1].length}"${id}>${mdInline(m[2])}</div>`;i++;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){html+='<hr class="md-hr">';i++;continue;}
    if(/^\s*>/.test(line)){let buf=[];while(i<lines.length&&/^\s*>/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++;}
      html+=`<div class="md-quote">${renderMd(buf.join('\n'))}</div>`;continue;}
    if(/^\s*([-*+]|\d+[.、)])\s+/.test(line)){
      let buf=[];while(i<lines.length&&lines[i].trim()!==''&&(/^\s*([-*+]|\d+[.、)])\s+/.test(lines[i])||/^\s{2,}\S/.test(lines[i]))){buf.push(lines[i]);i++;}
      html+=mdList(buf);continue;}
    if(line.trim()===''){i++;continue;}
    html+=`<p class="md-p">${mdInline(line)}</p>`;i++;
  }
  return html;
}

// Preparation attachments resolve from the source Markdown, not the dashboard URL.
function prepResourceKey(href,base){
  if(!href || /^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(href))return null;
  const url=new URL(href,'https://prep.invalid/'+base);
  return decodeURIComponent(url.pathname).replace(/^\//,'');
}
function bindPrepResourceLinks(container,base,availableKeys){
  container.querySelectorAll('a[href]').forEach(a=>{
    const key=prepResourceKey(a.getAttribute('href'),base);
    if(key===null)return;
    if(availableKeys&&!availableKeys.includes(key)){a.replaceWith(document.createTextNode(a.textContent));return;}
    const button=document.createElement('button');button.type='button';button.textContent=a.textContent+' · 展开内容';
    button.style.cssText='display:inline;border:0;padding:0;background:none;color:var(--primary,#386a70);text-align:left;font:inherit;cursor:pointer;text-decoration:underline';
    button.addEventListener('click',()=>openPrepResource(key,button));a.replaceWith(button);
  });
}
async function openPrepResource(key,button){
  if(button._resource){button._resource.open=!button._resource.open;return;}
  const block=document.createElement('details');block.open=true;block.className='prep-inline-resource';
  block.style.cssText='margin:12px 0;padding:14px;border:1px solid var(--border-light,#cbd5e1);border-radius:8px;max-width:100%;overflow-wrap:anywhere';
  const title=document.createElement('summary');title.textContent=key.split('/').pop()+'（点击收起）';title.style.cssText='cursor:pointer;font-weight:600';
  const content=document.createElement('div');content.className='pp-md';content.style.marginTop='12px';content.textContent='正在读取内容…';block.append(title,content);
  const host=button.closest('p,li,table')||button;host.after(block);button._resource=block;
  try{
    let data;
    if(window.__SNAPSHOT__){data=(window.__PREP_RESOURCES__||{})[key];if(!data)throw new Error('当前快照尚未包含此内容，请更新手机版。');}
    else{const res=await fetch(apiBase+'/api/prep-resource?path='+encodeURIComponent(key));if(!res.ok)throw new Error('未能读取内容，请确认本地中控台服务已更新。');data=await res.json();}
    if(!block.isConnected)return;content.textContent='';
    if(data.text!==undefined){
      const text=document.createElement('div');
      if(data.kind==='markdown')text.innerHTML=renderMd(data.text);
      else{text.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';text.textContent=data.text;}
      content.append(text);bindPrepResourceLinks(text,key,data.availableKeys||Object.keys(window.__PREP_RESOURCES__||{}));
    }
    if(data.mime==='application/pdf'&&data.data){
      const note=document.createElement('p');note.textContent='以上为原文文字。图表和原排版可在下方原页中直接查阅。';content.append(note);
      const pages=document.createElement('details');const summary=document.createElement('summary');summary.textContent='展开原页与图表';pages.append(summary);content.append(pages);
      pages.addEventListener('toggle',()=>{if(!pages.open||pages.dataset.loaded)return;pages.dataset.loaded='1';
        const bytes=Uint8Array.from(atob(data.data),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:data.mime}));
        const frame=document.createElement('iframe');frame.src=url;frame.title=data.name;frame.style.cssText='width:100%;height:70vh;border:0';pages.append(frame);
        const observer=new MutationObserver(()=>{if(!block.isConnected){URL.revokeObjectURL(url);observer.disconnect();}});observer.observe(document.body,{childList:true,subtree:true});
      });
    }else if(data.text===undefined){content.textContent='此文件尚无可直接阅读的正文。';}
  }catch(error){content.textContent=error.message;}
}

// ---- 小节/面经条目级拆分：### 标题 或 **X1. …** 这类加粗条目各自成卡；其余为该节引言 ----
function ppSplitCards(src){
  const lines=String(src||'').replace(/\r\n?/g,'\n').split('\n');
  const intro=[];const cards=[];let cur=null;
  const flush=()=>{if(cur){cards.push(cur);cur=null;}};
  lines.forEach(l=>{
    let m=l.match(/^(#{3,6})\s+(.*)$/);
    if(m){flush();cur={title:m[2].trim(),sub:'',body:''};return;}
    m=l.match(/^\s*\*\*([A-Za-z]?\d+[A-Za-z]?[.、)][^*]+)\*\*\s*(.*)$/);
    if(m){flush();cur={title:m[1].trim(),sub:m[2].trim(),body:''};return;}
    if(cur)cur.body+=l+'\n';else intro.push(l);
  });
  flush();
  return {intro:intro.join('\n'),cards};
}
function ppCardCount(p){return (p.sections||[]).reduce((n,s)=>n+ppSplitCards(s.md).cards.filter(c=>c.body.trim()).length,0);}
// 准备文档右栏：与问答库条目流同款平铺——节=分组头，条目=折叠卡，左栏搜索框筛选
function renderPrepQbankMain(main,p){

  let body='';
  const tocItems=[]; // {id,text,level}
  let secIdx=0, cardIdx=0;
  (p.sections||[]).forEach((s,idx)=>{
    const secId='prep-sec-'+secIdx++;
    const sp=ppSplitCards(s.md);
    let secHtml=sp.intro.trim()&&(!q||sp.intro.toLowerCase().includes(q)||s.title.toLowerCase().includes(q))?`<div class="pp-md pp-intro">${renderMd(sp.intro)}</div>`:'';
    const secTocStart=tocItems.length; // 先记录位置，section 标题将插入此处
    sp.cards.forEach(c=>{

        tocItems.push({id:cardId,text:c.title,level:2});

    if(secHtml){

      tocItems.splice(secTocStart,0,{id:secId,text:s.title,level:1}); // section 标题排在本节 cards 之前
    }
  });
  if(!body)body='<div class="rv-empty">'+(q?'无匹配条目':'暂无内容')+'</div>';
  // 本篇目录独立折叠，位于正文前；收起不保留侧栏宽度。
  let tocCol='';
  if(tocItems.length){
    const items=tocItems.map(it=>{
      const cls=['prep-toc-item'];
      if(it.level===2)cls.push('l2');
      return `<span class="${cls.join(' ')}" onclick="const t=document.getElementById('${it.id}'); if(t&&t.tagName==='DETAILS')t.open=true; if(t)scrollReaderTo(t)">${esc(it.text)}</span>`;
    }).join('');
    tocCol=`<div class="prep-toc-col"><details class="prep-toc-box"${qbFoldAttrs(['company',p.id,'toc'],false)}><summary>本篇目录</summary><div class="prep-toc-items">${items}</div></details></div>`;
  }
  main.innerHTML=`<div class="rv-panel prep-doc-layout" id="prepDoc"><div class="rv-panel-head"><h3>${esc(title)} ${chip}</h3></div>
    <div class="pp-meta" style="margin-bottom:12px">更新于 ${esc((p.updatedAt||'').replace('T',' '))}</div>
    <div class="prep-doc-body">
      <div class="prep-content-col">
        ${p.headerNote?`<details class="pp-note-fold"${qbFoldAttrs(['company',p.id,'note'])}><summary>资料说明</summary><div class="pp-note">${renderMd(p.headerNote)}</div></details>`:''}
        ${body}
      </div>
      ${tocCol}
    </div>
  </div>`;
  const doc=document.getElementById('prepDoc');
  bindPrepResourceLinks(doc,p.mdPath||'');
  highlightSearch(doc,qbSearch.trim());
}

function prepSearchResults(main){

let qbankVersion='0', qbankDraftBase=null, qbankSaveGeneration=0, qbankSaveInFlight=false, qbankDirty=false, qbankConflict=false;
let qbEdit={item:null}, qbSideCollapsed=localStorage.getItem('qbSideCollapsed')==='1';

function loadQbankCache(){const d=cachedData("toudiQBank");if(d&&Array.isArray(d.categories))qbData=d;}
function qbankFormEditing(){return !!qbEdit.item;}
function saveQbank(){
  if(!qbankMutationAllowed())return;

  if(qbankDraftBase===null)qbankDraftBase=String(qbankVersion);
  writeDraft('qbank',qbankDraftBase,{categories:qbData.categories});persistQbank();
}
function persistQbank(){
  if(apiBase===null)return;
  qbankDirty=true;
  if(qbankConflict){setSaveState('qbank','conflict','问答库冲突 · 草稿仍在本页');return;}
  qbankSaveGeneration++;setSaveState('qbank','saving','问答库保存中…');
  clearTimeout(qbSaveTimer);
  qbSaveTimer=setTimeout(flushQbank,400);
}
async function flushQbank(){
  clearTimeout(qbSaveTimer);qbSaveTimer=null;
  if(qbankSaveInFlight||!qbankDirty||qbankConflict||apiBase===null)return;
  qbankSaveInFlight=true;const sentGeneration=qbankSaveGeneration;const sentDraft=readOwnDraft('qbank');
  if(!sentDraft){qbankSaveInFlight=false;setSaveState('qbank','error','问答库草稿缺失，未发送');return;}
  const sentRevision=sentDraft.revision;
  try{
    const res=await fetch(apiBase+'/api/questionbank',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({categories:sentDraft.data.categories,base:sentDraft.base})});
    const body=await res.json().catch(()=>null);
    if(res.status===409){qbankConflict=true;setSaveState('qbank','conflict','问答库冲突 · 草稿仍在本页');showToast('问答库已在别处更新；点击保存状态可导出未提交草稿');return;}
    if(!res.ok)throw new Error((body&&body.error)||`HTTP ${res.status}`);
    if(!body||body.ok!==true||typeof body.version!=='string')throw new Error('invalid save acknowledgement');
    qbankVersion=body.version;
    if(qbankSaveGeneration===sentGeneration){qbankDirty=false;qbankDraftBase=null;localStorage.setItem('toudiQBank',JSON.stringify(qbData));clearOwnDraft('qbank',sentRevision);clearLegacySourceAfterSave(sentDraft);setSaveState('qbank','saved','问答库已保存');}
    else{qbankDraftBase=body.version;advanceOwnDraftBase('qbank',sentRevision,body.version);setSaveState('qbank','saving','问答库仍在保存…');}
  }catch(e){setSaveState('qbank','error','问答库保存失败 · 草稿已保留');showToast('问答库保存失败；点击保存状态可重试');}
  finally{qbankSaveInFlight=false;if(qbankDirty&&qbankSaveGeneration>sentGeneration&&!qbankConflict)setTimeout(flushQbank,0);}
}
async function initQbankStorage(){
  if(qbankDirty||qbankConflict||qbankFormEditing())return;
  if(!qbData.categories.length)loadQbankCache();
  qbLoadState='loading';
  const ownDraft=readOwnDraft('qbank'),legacyRaw=ownDraft?null:localStorage.getItem(LEGACY_DRAFT_KEY.qbank),legacyDraft=ownDraft?null:readLegacyDraft('qbank'),draft=ownDraft||(legacyDraft?migrateLegacyDraft('qbank',legacyDraft,legacyRaw):null);
  if(apiBase===null){if(draft&&Array.isArray(draft.data.categories)){qbData={categories:draft.data.categories};qbankDraftBase=String(draft.base);qbankDirty=true;setSaveState('qbank','error','发现未提交的问答库草稿');if(view==='qbank')renderQbank();}else loadQbankCache();qbLoadState='ready';if(view==='qbank')renderQbank();return;}
  const startedGeneration=qbankSaveGeneration;
  try{
    const res=await fetch(apiBase+'/api/questionbank');
    if(!res.ok)throw new Error('bad status');
    const payload=(await res.json())||{};
    if(qbankDirty||qbankConflict||qbankFormEditing()||qbankSaveGeneration!==startedGeneration)return;
    if(!Array.isArray(payload.categories))throw new Error('invalid payload');
    if(typeof payload.version!=='string'){
      qbData={categories:draft&&Array.isArray(draft.data.categories)?draft.data.categories:payload.categories};qbankWritable=false;qbLoadState='legacy';
      setReadError('qbank','内容可阅读，编辑暂不可用');if(view==='qbank')renderQbank();return;
    }
    qbankWritable=true;qbLoadState='ready';qbankVersion=payload.version;
    if(draft&&Array.isArray(draft.data.categories)){
      qbData={categories:draft.data.categories};qbankDraftBase=String(draft.base);qbankDirty=true;qbankConflict=qbankDraftBase!==String(payload.version);
      setSaveState('qbank',qbankConflict?'conflict':'error',qbankConflict?'问答库草稿基于旧版本，请先导出':'发现可重试的问答库草稿');
    }else{
      qbankDraftBase=null;qbData.categories=payload.categories;localStorage.setItem('toudiQBank',JSON.stringify(qbData));setSaveState('qbank','idle','');
    }
  }catch(e){
    qbankWritable=false;qbLoadState='error';
    if(draft&&Array.isArray(draft.data.categories))qbData={categories:draft.data.categories};
    if(!qbData.categories.length){try{const res=await fetch(new URL('逐字稿数据.json',location.href));if(res.ok){const fallback=await res.json();if(Array.isArray(fallback.categories))qbData={categories:fallback.categories};}}catch(_){} }
    setReadError('qbank','问答库读取失败');
  }
  if(view==='qbank')renderQbank();
}

function renderQbankMain(main){
  main=main||document.getElementById('qbMain');

  rememberQbFolds(main);
  main.dataset.foldSearch=qbSearch.trim()?'1':'0';
  if(prepSearchResults(main))return;
  if(currentQbCat&&currentQbCat.startsWith('prep:')){
    const p=prepById(currentQbCat.slice(5));
    if(p){renderPrepQbankMain(main,p);return;}
  }
  const cat=qbCatById(currentQbCat);
  if(!cat){
    // 自愈：有大类数据但 currentQbCat 失效（时序/坏缓存）时回退到第一个大类重渲染，而不是直接报错

    main.innerHTML='<div class="rv-panel rv-empty">'+(qbMode==='company'?'暂无公司准备':qbLoadState==='ready'?'暂无通用准备':'通用准备暂未加载')+'</div>';return;
  }
  const items=cat.items.filter(qbMatch);
  let html=`<div class="rv-panel"><div class="rv-panel-head"><h3>${esc(cat.name)}（${items.length}）</h3><div><button class="btn btn-sm btn-primary" onclick="qbAddItem('${cat.id}')">+ 新增条目</button></div></div>`;
  const groups={};const order=[];
  items.forEach(it=>{const g=it.group||'';if(!groups[g]){groups[g]=[];order.push(g);}groups[g].push(it);});
  const renderGroupBody=(its)=>{
    const stars=its.filter(i=>!i.qa), qas=its.filter(i=>i.qa);
    let inner='';
    stars.forEach(it=>{inner+=qbItemCard(cat.id,it,cat.name==='项目经历');});
    if(qas.length){
      if(stars.length)inner+=`<div class="qb-qa-divider">追问要点（${qas.length}）</div>`;
      qas.forEach(it=>{inner+=qbItemCard(cat.id,it,true);});
    }
    return inner;
  };
  const renderGroup=(g)=>{
    const its=groups[g];
    const inner=renderGroupBody(its);
    if(!g)return inner; // 无分组条目平铺
    const label=g.includes('｜')?g.split('｜').slice(1).join('｜'):g;
    return `<details class="qb-group-fold"${qbFoldAttrs(['general',cat.id,'group',g],!!qbSearch)}><summary><span class="qb-group-name">${esc(label)}</span><span class="qb-group-count">${its.length} 条</span><span class="rv-arrow">›</span></summary><div class="qb-group-body">${inner}</div></details>`;

  });
  l1order.forEach(c=>{

    if(c){

    } else {
      html+=cards;
    }
  });
  if(!items.length)html+='<div class="rv-empty">该大类暂无条目，点右上角「新增条目」。</div>';
  html+='</div>';

function exportData(silent=false){
  const backup={format:'toudi-personal-backup',version:2,exportedAt:new Date().toISOString(),edits:userEdits,pref:preferences};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  downloadBlob(blob,`投递个人数据备份_${today()}.json`);if(!silent)showToast('完整个人数据备份已导出');
}
function validatePersonalBackup(imported){
  if(!imported||imported.format!=='toudi-personal-backup'||imported.version!==2)throw new Error('只支持“完整个人数据备份”V2；旧列表文件不会用于全量替换');
  if(!isPlainObject(imported.edits)||!isPlainObject(imported.pref))throw new Error('备份结构不完整');
  const cleanEdits={};
  for(const [key,raw] of Object.entries(imported.edits)){
    if(!key||key==='__proto__'||!isPlainObject(raw))throw new Error(`个人记录结构无效：${key||'空键'}`);
    if(raw.status!==undefined&&(!STATUSES.includes(raw.status)))throw new Error(`进度值无效：${key}`);
    for(const name of ['note','researchNote'])if(raw[name]!==undefined&&typeof raw[name]!=='string')throw new Error(`${key} 的 ${name} 必须是文本`);
    for(const name of ['starred','excluded','research'])if(raw[name]!==undefined&&typeof raw[name]!=='boolean')throw new Error(`${key} 的 ${name} 必须是布尔值`);
    if(raw.fields!==undefined){
      if(!isPlainObject(raw.fields))throw new Error(`${key} 的字段覆盖结构无效`);
      for(const [field,value] of Object.entries(raw.fields))if(!EDITABLE_FIELDS.includes(field)||typeof value!=='string')throw new Error(`${key} 含无效字段覆盖：${field}`);
    }
    cleanEdits[key]=JSON.parse(JSON.stringify(raw));
  }
  const cleanPref=JSON.parse(JSON.stringify(imported.pref));
  for(const name of ['natures','industries','education']){
    if(!Array.isArray(cleanPref[name])||cleanPref[name].some(v=>typeof v!=='string'))throw new Error(`偏好 ${name} 必须是文本数组`);
  }
  if(cleanPref.rvSideCollapsed!==undefined&&typeof cleanPref.rvSideCollapsed!=='boolean')throw new Error('偏好 rvSideCollapsed 必须是布尔值');
  return {edits:cleanEdits,pref:{...DEFAULT_PREF,...cleanPref}};
}
function importData(event){
  if(!personalMutationAllowed()){event.target.value='';return;}
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const imported=JSON.parse(e.target.result);const checked=validatePersonalBackup(imported);
      const restored=checked.edits,pref=checked.pref;
      const count=Object.keys(restored).length;
      const existing=new Set(Object.keys(userEdits)),incoming=new Set(Object.keys(restored));
      const added=[...incoming].filter(k=>!existing.has(k)).length,replaced=[...incoming].filter(k=>existing.has(k)).length,removed=[...existing].filter(k=>!incoming.has(k)).length;
      if(!confirm(`已完整校验备份：${count} 条（新增 ${added}、覆盖 ${replaced}、移除当前独有 ${removed} 条）。将执行全量替换，并先下载当前数据备份。继续吗？`))return;
      exportData(true);
      userEdits=restored;preferences=pref;reapplyEdits();saveEdits();buildFilterPanel();render();showToast(`已载入 ${count} 条，正在保存；原数据备份已下载`);
    }catch(err){showToast('导入失败: '+err.message);}
  };
  reader.readAsText(file);event.target.value='';
}
function clearAllEdits(){
  if(!personalMutationAllowed())return;
  if(!confirm('将清除全部个人数据：进度、备注、收藏、不适合、待探查、探查记录和字段覆盖。系统会先下载一份完整备份。继续吗？'))return;
  exportData(true);
  userEdits={};saveEdits();
  data.forEach(item=>{item._status='未投递';item._note='';item._starred=false;item._excluded=false;item._research=false;item._researchNote='';applyFieldOverrides(item,{});});
  render();showToast('已清除全部个人数据，正在保存；备份已下载');
}

// View data is loaded on demand. Cached content stays visible; existing version/draft readers remain authoritative.
const moduleDataLoads=new Map();
function ensureViewData(target,force=false){
  if(!['qbank','review','prospect'].includes(target))return Promise.resolve();
  if(!force&&moduleDataLoads.has(target))return moduleDataLoads.get(target);
  const load=async()=>{
    if(target==='qbank'){loadQbankCache();loadPrepsCache();if(window.__SNAPSHOT__){qbLoadState='ready';qbankWritable=false;}else if(serverMode)await Promise.all([initQbankStorage(),initPrepsStorage()]);}
    if(target==='review'){loadReviewsCache();if(!window.__SNAPSHOT__&&serverMode)await initReviewsStorage();}
    if(target==='prospect'){loadProspectsCache();if(!window.__SNAPSHOT__&&serverMode)await initProspectsStorage();}
    if(view===target){if(target==='qbank'&&!qbankFormEditing())renderQbank();if(target==='review'&&!reviewFormEditing())renderReview();if(target==='prospect')renderProspect();updateDirectoryControls();}
  };
  // Before the local connection settles, keep cached content but let the connection load it again.
  if(!serverMode&&!window.__SNAPSHOT__){if(target==='qbank'){loadQbankCache();loadPrepsCache();}if(target==='review')loadReviewsCache();if(target==='prospect')loadProspectsCache();return Promise.resolve();}
  const task=load();moduleDataLoads.set(target,task);return task;
}
function applyTheme(){const chosen=['light','dark','system'].includes(workspace.theme)?workspace.theme:'system';document.documentElement.dataset.theme=chosen==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):chosen;document.documentElement.dataset.motion=workspace.motion==='off'?'off':'on';}
function setAppearance(key,value){workspace[key]=value;saveWorkspace();applyTheme();}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(workspace.theme==='system')applyTheme();});
function updateDirectoryControls(){for(const id of ['qbSide','rvSide','prospectSide']){const side=document.getElementById(id);if(!side)continue;const collapsed=side.classList.contains('rv-collapsed');for(const button of side.querySelectorAll('.rv-collapse-btn,.rv-rail-btn:first-child')){button.textContent=button.classList.contains('rv-collapse-btn')?'收起目录':'展开目录';button.title=button.textContent;button.setAttribute('aria-label',button.textContent);button.setAttribute('aria-controls',id);button.setAttribute('aria-expanded',String(!collapsed));}}}

function industryPreferenceGroups(){const leaves=[...new Set([...data.flatMap(row=>(row['行业']||'').split('/').map(v=>v.trim()).filter(Boolean)),...preferences.industries])];const groups=INDUSTRY_DISPLAY_GROUPS.map(([name,pattern])=>({name,pattern:new RegExp(pattern,'i'),values:[]}));const other={name:'其他 / 未归类',values:[]};for(const leaf of leaves){const g=groups.find(g=>g.pattern.test(leaf))||other;g.values.push(leaf);}return [...groups,other].filter(g=>g.values.length).map(g=>({...g,values:g.values.sort((a,b)=>a.localeCompare(b,'zh-CN'))}));}
function renderIndustryPreferences(){const groups=industryPreferenceGroups();document.getElementById('prefIndustries').classList.remove('pref-options');document.getElementById('prefIndustries').innerHTML=`<div class="industry-tools"><input id="industrySearch" type="search" placeholder="搜索行业或小类…" aria-label="搜索行业偏好" oninput="filterIndustryPreferences(this.value)"><button type="button" class="btn btn-sm" onclick="showSelectedIndustries()">只看已选</button></div><div id="industrySelection" class="industry-selection"></div>${groups.map((g,i)=>`<details class="industry-group" data-industry-group="${i}"><summary>${esc(g.name)} <span class="industry-count">${g.values.length}</span></summary><div class="industry-group-actions"><button type="button" class="btn btn-sm" onclick="selectIndustryGroup(${i},true)">选择组内全部</button><button type="button" class="btn btn-sm" onclick="selectIndustryGroup(${i},false)">取消组内选择</button></div><div class="pref-options">${g.values.map(value=>`<label class="pref-option" data-industry-leaf="${esc(value)}"><input type="checkbox" value="${esc(value)}" ${preferences.industries.includes(value)?'checked':''} onchange="updateIndustrySelection()"> ${esc(value)}</label>`).join('')}</div></details>`).join('')}`;updateIndustrySelection();}

function selectIndustryGroup(index,checked){document.querySelectorAll(`[data-industry-group="${index}"] input[type=checkbox]`).forEach(el=>el.checked=checked);updateIndustrySelection();}
function filterIndustryPreferences(query){const needle=query.trim().toLowerCase();document.querySelectorAll('.industry-group').forEach(group=>{const groupMatch=group.querySelector('summary').textContent.toLowerCase().includes(needle);let visible=0;group.querySelectorAll('[data-industry-leaf]').forEach(label=>{const show=!needle||groupMatch||label.dataset.industryLeaf.toLowerCase().includes(needle);label.hidden=!show;visible+=show?1:0;});group.hidden=visible===0;if(needle&&visible)group.open=true;});}

// One fixed entry point replaces repeated per-workflow Agent fields. Existing exports retain legacy settings.
let workspaceConnection=null,workspaceConnectionError='',agentGuideText='',workspaceInfoPromise=null;
const GENERIC_AGENT_BOOTSTRAP='请接手我的投递工作台。先读取项目根 AGENTS.md、数据目录 AGENTS.md、工作区配置.json及 docs/Agent接入.md。首次接入向我确认投递信源、工作区根目录、简历和准备/复盘资料目录、要协作的流程及目标范围；已经明确的信息沿用。读取当前磁盘母本，不凭会话猜测事实。按用户明确目标执行数据更新、岗位探查、面试准备、复盘、明确授权后的内化或手机版同步；每项核对输入/前置、规则、输出、验证与失败恢复，不能隐含触发其他流程。工作区HTML必须包含我的信源生成的RAW_DATA，并与四份JSON、准备/探查及附件属于同一工作区。公开页面不能凭路径连接本机文件，请在用户指定目录准备自身产物并启动仅loopback同源本地工作台，打开本地地址。浏览器外观偏好与业务母本分开，保留字符串base/version与409草稿保护；不公开凭据或个人资料。';
function agentBootstrapText(){return GENERIC_AGENT_BOOTSTRAP+(workspaceConnection?`\n\n当前实例数据目录：${workspaceConnection.root}\n当前同源工作台：${location.origin}${location.pathname}\n信源约定：${workspaceConnection.config.sourcePolicy}\n完整标准流程入口：${workspaceConnection.root}/docs/Agent接入.md`:'\n\n当前未确认本地工作区连接。请先由用户指定其工作区与信源；公开只读页面不代表已经连接本机资料。');}
async function copyAgentBootstrap(){const text=agentBootstrapText();try{await navigator.clipboard.writeText(text);showToast('接入说明已复制');}catch(e){const el=document.getElementById('agentBootstrap');el.value=text;el.focus();el.select();if(document.execCommand('copy'))showToast('接入说明已复制');else showToast('请选择接入说明文本并复制');}}
async function inspectWorkspace(force=false){if(window.__SNAPSHOT__||!['127.0.0.1','localhost','[::1]'].includes(location.hostname)){workspaceConnection=null;workspaceConnectionError='当前为静态阅读页，不能凭路径连接本机文件。';return;}if(workspaceInfoPromise&&!force)return workspaceInfoPromise;workspaceInfoPromise=(async()=>{try{const response=await fetch('/api/workspace');if(!response.ok)throw Error('本地服务尚未提供工作区状态；请按启动说明重新启动。');const info=await response.json();if(info.protocol!==1||info.mode!=='local'||!info.sameOriginOnly)throw Error('工作区状态接口不匹配');workspaceConnection=info;workspaceConnectionError='';if(view==='settings'){const box=document.getElementById('connectionStatus');if(box)box.innerHTML=workspaceConnectionMarkup();const text=document.getElementById('agentBootstrap');if(text)text.value=agentBootstrapText();}}catch(e){workspaceConnection=null;workspaceConnectionError=e.message;if(view==='settings'){const box=document.getElementById('connectionStatus');if(box)box.innerHTML=workspaceConnectionMarkup();}}})();return workspaceInfoPromise;}
function workspaceConnectionMarkup(){if(window.__SNAPSHOT__)return '<p>加密只读快照：不连接本地API，个人记录在电脑工作区修改。</p>';if(workspaceConnection)return `<p>已连接当前本地工作区。业务保存到该目录，浏览器设置独立保存。</p><p class="connection-path">${esc(workspaceConnection.root)}</p><p>${esc(workspaceConnection.config.sourcePolicy)}</p>${workspaceConnection.missing.length?`<p class="error-text">工作区缺少：${esc(workspaceConnection.missing.join('、'))}</p>`:''}`;return `<p>${esc(workspaceConnectionError||'正在确认当前本地工作区…')}</p>`;}

abel class="btn btn-sm">恢复显示偏好<input type="file" accept="application/json" hidden onchange="importWorkspace(event)"></label>')}</section>`;const host=document.getElementById('maintenanceActions');if(maintenanceTools){host.append(maintenanceTools);maintenanceTools.style.display='flex';maintenanceTools.querySelectorAll('.nav-text').forEach(e=>e.style.display='inline');}applyTheme();}

}
